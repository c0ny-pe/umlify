# Reference reverse-proxy block for serving UMLify at
# https://cc3002.dcc.uchile.cl/umlify  ->  Node app on localhost:8009.
#
# The /umlify prefix is PRESERVED (proxy_pass has no trailing slash): the Express
# backend is configured with BASE_PATH=/umlify and expects requests as /umlify/...
# Add inside the existing cc3002.dcc.uchile.cl server { } block.

location /umlify/ {
    proxy_pass http://localhost:8009;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

# Redirect the bare /umlify to /umlify/ so relative asset paths resolve.
location = /umlify {
    return 301 /umlify/;
}
